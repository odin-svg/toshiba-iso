name: Build Toshiba L505 macOS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest

    steps:
      - name: Update system and install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso git rsync squashfs-tools dosfstools e2fsprogs xorriso

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup archiso profile
        run: |
          mkdir -p /build/toshiba
          cp -r /usr/share/archiso/configs/releng/. /build/toshiba/

      - name: Configure packages
        run: |
          cat > /build/toshiba/packages.x86_64 <<'EOF'
          base
          linux
          linux-firmware
          mkinitcpio
          intel-ucode
          networkmanager
          network-manager-applet
          pipewire
          pipewire-alsa
          pipewire-pulse
          wireplumber
          pavucontrol
          alacritty
          thunar
          firefox
          mpv
          zathura
          zathura-pdf-mupdf
          git
          curl
          wget
          htop
          neofetch
          xorg-server
          xorg-xinit
          xorg-drivers
          xf86-input-libinput
          xf86-video-ati
          mesa
          picom
          xfce4-panel
          xfce4-session
          xfce4-settings
          xfce4-terminal
          xfdesktop
          xfwm4
          lightdm
          lightdm-gtk-greeter
          polkit
          ttf-inter
          noto-fonts
          noto-fonts-emoji
          papirus-icon-theme
          zram-generator
          syslinux
          dosfstools
          efibootmgr
          grub
          EOF

      - name: Write custom configs
        run: |
          OV=/build/toshiba/airootfs
          mkdir -p "$OV/etc/skel/.config/alacritty" \
                   "$OV/etc/skel/.config/picom" \
                   "$OV/etc/X11/xorg.conf.d" \
                   "$OV/etc/lightdm/lightdm.conf.d" \
                   "$OV/etc/skel/.config/autostart"

          # Radeon TearFree + glamor
          cat > "$OV/etc/X11/xorg.conf.d/20-radeon.conf" <<'XORG'
          Section "Device"
              Identifier  "HD4570"
              Driver      "radeon"
              Option      "AccelMethod" "glamor"
              Option      "TearFree"    "true"
              Option      "DRI"         "2"
          EndSection
          XORG

          # Picom blur tuned for HD4570
          cat > "$OV/etc/skel/.config/picom/picom.conf" <<'PICOM'
          backend = "glx";
          use-damage = true;
          vsync = true;
          blur { method = "dual_kawase"; strength = 3; }
          shadow = true; shadow-radius = 10;
          fading = true; fade-in-step = 0.05;
          inactive-opacity = 0.97;
          PICOM

          cat > "$OV/etc/skel/.config/autostart/picom.desktop" <<'AUTO'
          [Desktop Entry]
          Type=Application
          Name=Picom
          Exec=picom
          AUTO

          # Alacritty transparent terminal
          cat > "$OV/etc/skel/.config/alacritty/alacritty.toml" <<'ALA'
          [window]
          opacity = 0.90
          padding = { x = 12, y = 10 }
          [font]
          normal = { family = "Inter", size = 11.5 }
          [colors.primary]
          background = "#1e1e2e"
          foreground = "#cdd6f4"
          ALA

          # LightDM autologin
          cat > "$OV/etc/lightdm/lightdm.conf.d/50-autologin.conf" <<'LDM'
          [Seat:*]
          autologin-user=live
          autologin-user-timeout=0
          user-session=xfce
          greeter-session=lightdm-gtk-greeter
          LDM

          # zram with zstd for 4GB RAM
          cat > "$OV/etc/systemd/zram-generator.conf" <<'ZR'
          [zram0]
          zram-size = min(ram * 0.5, 2048)
          compression-algorithm = zstd
          ZR

      - name: Enable services
        run: |
          mkdir -p /build/toshiba/airootfs/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/NetworkManager.service \
            /build/toshiba/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          ln -sf /usr/lib/systemd/system/lightdm.service \
            /build/toshiba/airootfs/etc/systemd/system/multi-user.target.wants/lightdm.service

      - name: Build the ISO
        run: |
          cd /build/toshiba
          mkarchiso -v .

      - name: Rename and checksum
        run: |
          mv /build/toshiba/out/*.iso /build/toshiba/out/toshiba-l505-macos.iso
          sha256sum /build/toshiba/out/toshiba-l505-macos.iso | tee /build/toshiba/out/toshiba-l505-macos.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: toshiba-l505-macos-iso
          path: /build/toshiba/out/toshiba-l505-macos.iso*
          retention-days: 30
